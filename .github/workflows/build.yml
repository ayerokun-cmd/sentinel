# Builds Sentinel for Windows, macOS and Linux.
# - Every push: runs the tests and builds the programs (downloadable from the Actions tab).
# - Pushing a version tag (e.g. v0.3.0): also publishes them on the repo's Releases page.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: Sentinel.exe
            asset: Sentinel-windows.exe
          - os: macos-latest
            file: Sentinel
            asset: Sentinel-macos
          - os: ubuntu-latest
            file: Sentinel
            asset: Sentinel-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover tests
      - name: Build program
        run: |
          pip install pyinstaller
          python build.py
      - name: Rename for download
        shell: bash
        run: mv "dist/${{ matrix.file }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            Download the file for your computer and double-click it.

            - **Windows:** Sentinel-windows.exe. If Windows says "Windows protected your PC", click *More info*, then *Run anyway*.
            - **Mac:** Sentinel-macos. Right-click it and choose *Open* the first time.
            - **Linux:** Sentinel-linux. Run `chmod +x Sentinel-linux` and then `./Sentinel-linux`.
